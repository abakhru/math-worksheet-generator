name: MathWorksheet
options:
  bundleIdPrefix: com.mathworksheet
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"
  generateEmptyDirectories: true

settings:
  SWIFT_VERSION: "5.9"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  MathWorksheet:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/MathWorksheet
    info:
      path: Sources/MathWorksheet/Info.plist
      properties:
        CFBundleDisplayName: Math Worksheet
        CFBundleName: MathWorksheet
        UILaunchStoryboardName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.mathworksheet.app
      INFOPLIST_FILE: Sources/MathWorksheet/Info.plist
