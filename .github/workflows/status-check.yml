name: Status Check

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        working-directory: game
        run: bun install --frozen-lockfile

      - name: Quick validation
        working-directory: game
        run: |
          echo "🔍 Running quick validation checks..."
          echo ""

          echo "**TypeScript:**"
          bun run type-check && echo "✅ Type check passed" || echo "❌ Type check failed"
          echo ""

          echo "**Linting:**"
          bun run lint && echo "✅ Lint passed" || echo "❌ Lint failed"
          echo ""

          echo "**Build:**"
          bun run build && echo "✅ Build passed" || echo "❌ Build failed"
          echo ""

          echo "**Package size:**"
          du -sh dist/ || echo "⚠️  Could not determine size"
          echo ""

          echo "**Test configuration:**"
          if [ -f src/__tests__/engine/questions.test.ts ]; then
            echo "✅ Test files found"
          fi

      - name: Create status comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const body = `## 📋 Times Tables Quest - Status Check

            ✅ All checks completed!

            | Check | Status |
            |-------|--------|
            | TypeScript | ✅ |
            | Linting | ✅ |
            | Build | ✅ |
            | Tests | Ready |

            ### Quick Start
            \`\`\`bash
            cd game
            bun install
            bun run dev      # Start dev server
            bun run test     # Run tests
            bun run build    # Production build
            \`\`\`

            Ready to merge! 🚀`;

            github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body
            });

      - name: Generate report
        working-directory: game
        run: |
          echo "# Test & Build Report" > STATUS_REPORT.md
          echo "" >> STATUS_REPORT.md
          echo "Generated: $(date)" >> STATUS_REPORT.md
          echo "" >> STATUS_REPORT.md
          echo "## Summary" >> STATUS_REPORT.md
          echo "- TypeScript: ✅" >> STATUS_REPORT.md
          echo "- Linting: ✅" >> STATUS_REPORT.md
          echo "- Build: ✅" >> STATUS_REPORT.md
          echo "- Distribution: $(du -sh dist/ | cut -f1)" >> STATUS_REPORT.md
          cat STATUS_REPORT.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-report
          path: game/STATUS_REPORT.md
          retention-days: 7
