name: Test & Build

on:
  push:
    branches: [dev, main]
    paths:
      - 'game/**'
      - '.github/workflows/test-and-build.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'game/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: game
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: game
        run: bun run type-check

      - name: Lint
        working-directory: game
        run: bun run lint

      - name: Run tests
        working-directory: game
        run: bun run test --run

      - name: Build
        working-directory: game
        run: bun run build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: game-dist
          path: game/dist/
          retention-days: 7

      - name: Check build size
        if: success()
        working-directory: game
        run: |
          SIZE=$(du -sh dist/ | cut -f1)
          echo "📦 Build size: $SIZE"
          SIZE_KB=$(du -sk dist/ | cut -f1)
          if [ "$SIZE_KB" -gt 500 ]; then
            echo "⚠️ Build size warning: $SIZE_KB KB (consider optimization)"
          fi
