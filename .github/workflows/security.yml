name: Security Scan

on:
  push:
    branches: [dev, main]
    paths:
      - 'game/package.json'
      - 'game/bun.lock'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [dev, main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high game/
        continue-on-error: true

      - name: Install bun
        uses: oven-sh/setup-bun@v1

      - name: Check for outdated packages
        working-directory: game
        run: |
          echo "Checking for outdated packages..."
          bun outdated || true

  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        working-directory: game
        run: bun install --frozen-lockfile

      - name: Run type check
        working-directory: game
        run: bun run type-check

      - name: Run linter
        working-directory: game
        run: bun run lint

      - name: Check for console logs
        working-directory: game
        run: |
          # Warn about console.log in production code
          if grep -r "console\." src/ --include="*.ts" --include="*.tsx" --exclude-dir="__tests__" || true; then
            echo "⚠️ Warning: Found console statements in production code"
          fi
